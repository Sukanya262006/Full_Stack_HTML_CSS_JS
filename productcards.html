<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
    font-family: Arial, sans-serif;
}

.card-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 30vh;
}

.card {
    display: inline-block;
    margin: 20px;
    padding: 20px;
    border: 1px solid #ccc;
    flex-wrap: wrap;
    flex-direction: column;
    align-items: center;

}

h1{
    font-size: 24px;
    margin-bottom: 10px;
    align-items: center;
}
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card">
            
       
        <h1 align="center">Wireless Headphones</h1>
        <p align="center">high quality sound</p>
        <h2 align="center">$99.99</h2>
        <button class="buy-button" align="center">Buy Now</button>
    </div>

     <div class="card">
        <h1 align="center">Bluetooth Speaker</h1>
        <p align="center">high quality sound</p>
        <h2 align="center">$299.99</h2>
        <button class="buy-button" align="center">Buy Now</button>
    </div>

     <div class="card">
       
        <h1 align="center">Smart Watch</h1>
        <p align="center">advanced features</p>
        <h2 align="center">$929.99</h2>
        <button class="buy-button" align="center">Buy Now</button>
    </div>
</body>
</html>

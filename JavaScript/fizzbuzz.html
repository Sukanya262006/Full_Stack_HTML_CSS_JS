<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" id="num" placeholder="Enter the number">
    <button id="evaluate" onclick="checkNumber()">evaluate</button>
    <p id="output"></p>

    <script>
        function checkNumber(){
            var x = parseInt(document.getElementById("num").value, 10);
            if (Number.isNaN(x)) {
                document.getElementById("output").textContent = "Please enter a number";
                return;
            }
            if(x%3==0 && x%5!=0){
                document.getElementById("output").textContent = "Fizz";
            }
            else if(x%3!=0 && x%5==0){
                document.getElementById("output").textContent = "Buzz";
            }
            else if(x%3==0 && x%5==0){
                document.getElementById("output").textContent = "FizzBuzz";
            }
            else {
                document.getElementById("output").textContent = x;
            }
        }
    </script>
</body>
</html>

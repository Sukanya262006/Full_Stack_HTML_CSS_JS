<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Traffic Light Simulator</title>
</head>
<body>
	<h1>Traffic Light Simulator</h1>

	<script>
		const lightColor = "red";

		switch (lightColor) {
			case "red":
				console.log("stop");
				break;
			case "yellow":
				console.log("slow down");
				break;
			case "green":
				console.log("go");
				break;
			default:
				console.log("Invalid light color");
		}
	</script>
</body>
</html>

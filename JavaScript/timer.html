<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <input type="number" id="inputmins">mins
    <input type="number" id="inputsecs">secs
    <br>
    <button id="start">Start timer</button>
    <button id="add">+1 minute</button>

    <h1><span id="mins">00</span> : <span id="secs">00</span></h1>

    <script>
        document.getElementById("start").onclick = function(){

            let minvalue = Number(document.getElementById("inputmins").value);
            let secvalue = Number(document.getElementById("inputsecs").value);
            let mins = document.getElementById("mins");
            let secs = document.getElementById("secs");
            let time = minvalue*60 + secvalue;

            document.getElementById("add").onclick = function(){
                // time+=60;
                minvalue += 1;
            }

            const timer = setInterval(() => {    
                if(time>0){
                    if(secvalue>0) secvalue--;
                    else if(secvalue==0 && minvalue>0){
                        minvalue--;
                        secvalue = 59;
                    }
                    mins.textContent = minvalue;
                    secs.textContent = secvalue;
                }
            }, 1000);  
        }
    </script>
</body>
</html>

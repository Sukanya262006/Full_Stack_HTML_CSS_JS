<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Login Card</title>
    <style>
        .container{
            height:90vh;
            display:flex;
            flex-direction: row;
            justify-content:center;
            align-items: center;
        }
        .container>div{
            color:white;
            width:100px;
            height:100px;
            align-content:center;
            text-align:center;
            border-radius: 9px;
 
        }
        #box1{
            background-color: antiquewhite;
        }
        #box2{

            background-color: rgb(224, 224, 174);

        }
        #box3{
        
            background-color: rgb(240, 213, 178);

        }
        #box4{
            background-color: rgb(167, 210, 210);
        }
        #box5{
            background-color: rgb(221, 248, 204);
        }
        #box6{
            background-color: rgb(196, 220, 213);
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div>
    </div>
</body>
</html>

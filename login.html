<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Login Card</title>
    <style>
        .container{
            height:90vh;
            display:flex;
            flex-direction: row;
            justify-content:center;
            align-items: center;
        }
        .container>div{
            color:white;
            width:100px;
            height:100px;
            align-content:center;
            text-align:center;
            border-radius: 9px;
 
        }
        #box1{
            background-color: antiquewhite;
        }

    </style>
</head>
<body>

    <div class="container">
        <div id="box1">
            <h2>Login</h2><br/><br/>
            <input type="text" placeholder="Enter username"><br/><br/>
            <input type="text" placeholder="Enter password"><br/><br/>
            <button>Login</button>
        </div>

    </div>
</body>
</html>

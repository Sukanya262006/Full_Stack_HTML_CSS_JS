<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*all h2 in section*/
        section h2{
            color:blue;
        }
        /*specific h2*/
        section>h2{
            color:aqua;
        }
        /*all soblings*/
        h2~p{
            color:green;
            font-size: 40px;
        }
        /*direct sibling*/
        h2+p{
            font-size: 30px;
            color:rgb(255, 187, 0);
        }

    </style>
</head>
<body>
    <section>
        <h2>Heading1</h2>
        <p>Para1</p>
        <p>Para2</p>
        <div>
            <h2>Heading2</h2>
        </div>
    </section>
</body>
</html>

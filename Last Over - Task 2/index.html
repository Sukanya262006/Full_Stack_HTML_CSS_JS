<!DOCTYPE html>
<html>
<head>
<title>Last Over</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h2>Last Over</h2>

Difficulty:
<select id="level">
  <option value="easy">Easy</option>
  <option value="medium" selected>Medium</option>
  <option value="hard">Hard</option>
</select>

<p>
  Runs needed: <b id="need"></b> |
  Balls left: <b id="balls"></b> |
  Wickets: <b id="wickets"></b> |
  Best: <b id="best"></b>
</p>

<div id="pitch">
  <div id="zone"></div>
  <div id="ball"></div>
</div>

<p><button id="hit">Hit (Spacebar)</button></p>
<p id="commentary"></p>

<div id="end" style="display:none">
  <h3 id="endText"></h3>
  <button id="again">Play Again</button>
</div>

<script src="script.js"></script>
</body>
</html>

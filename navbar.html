<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page with Navbar</title>
    <style>
        

        body {
            height: 100vh;
            display: flex;
            flex-direction: column; /* Stack navbar and main content */
            background-color: #fdfdfd;
            
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #22010e;
            padding: 16px 40px;
            border-bottom: 1px solid #e1e8ed;
            width: 100%;
        }

        .nav-logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: #007bff;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #bfb9b9;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #007bff;
        }
      
        
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="#" class="nav-logo">NAME</a>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Help</a></li>
            <li><a href="#">Contacts</a></li>
        </ul>
    </nav>


</body>
</html>

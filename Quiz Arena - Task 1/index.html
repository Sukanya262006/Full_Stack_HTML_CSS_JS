<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Quiz Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>JS Quiz Arena</h1>

    <!-- Quiz screen -->
    <section id="quiz-screen">
      <div class="top-bar">
        <span id="progress">Q 1/25</span>
        <span id="timer">30s</span>
        <span id="score">Score: 0</span>
      </div>
      <div class="progress-track"><div id="progress-fill"></div></div>

      <h2 id="question"></h2>
      <div id="options"></div>

      <div id="explanation" class="hidden"></div>

      <div class="actions">
        <button id="restart-btn" class="btn secondary">Restart</button>
        <button id="next-btn" class="btn" disabled>Next</button>
      </div>
    </section>

    <!-- Result screen -->
    <section id="result-screen" class="hidden">
      <h2>Quiz Complete!</h2>
      <p id="final-score" class="big"></p>
      <p id="rating"></p>
      <div class="actions">
        <button id="review-btn" class="btn secondary">Review wrong answers</button>
        <button id="restart-btn-2" class="btn">Restart</button>
      </div>
    </section>

    <!-- Review screen -->
    <section id="review-screen" class="hidden">
      <h2>Review wrong answers</h2>
      <div id="review-list"></div>
      <div class="actions">
        <button id="back-btn" class="btn secondary">Back</button>
        <button id="restart-btn-3" class="btn">Restart</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

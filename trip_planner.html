<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }
        .hero {
            height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;
        }
        .hero h1 {
            font-size: 80px;
            letter-spacing: 7px;
        }
        .hero p {
            margin-top: 15px;

            color: #aaa;

            font-size: 20px;
            letter-spacing: 3px;
        }
        .trip {
            height: 100vh;
            width: 100%;

            display: flex;
            align-items: center;

            overflow: hidden;
        }
.image-section {
    width: 35%;
    height: 100%;

    display: flex;
    align-items: center;

    overflow-x: auto;
    overflow-y: hidden;

    padding: 0 30px;

    scrollbar-width: none;
    -ms-overflow-style: none;
}

.image-section::-webkit-scrollbar {
    display: none;
}


/* ================= IMAGE CARD ================= */

.image-card {
    flex: 0 0 70%;

    height: 65%;

    position: relative;

    flex-shrink: 0;

    margin-left: -25%;

    isolation: isolate;
}


/* FIRST IMAGE */

.image-card:first-child {
    margin-left: 0;
}


/* ================= IMAGE ================= */

.image-card img {

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    border-radius: 20px;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.8);
}
.image-card:nth-child(1) {
    z-index: 1;
}
.image-card:nth-child(2) {
    z-index: 2;
}
.image-card:nth-child(3) {
    z-index: 3;
}
.image-card:nth-child(4) {
    z-index: 4;
}
.image-card:nth-child(5) {
    z-index: 5;
}
        .text-section {
            width: 65%;
            height: 80%;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .day {
            color: red;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }
        .text-section h2 {
            font-size: 50px;
            margin-bottom: 25px;
        }
        .text-section p {
            color: #aaa;
            font-size: 18px;
            line-height: 1.7;
            max-width: 600px;
            margin-bottom: 30px;
        }
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 50px;
            }
            .hero p {
                font-size: 16px;
            }
            .trip {
                flex-direction: column;
            }
            .image-section {
                width: 100%;
                height: 50%;
            }
            .image-card {
                flex: 0 0 55%;
                height: 90%;
            }
            .text-section {
                width: 100%;
                height: 50%;

                padding: 30px;
            }
            .text-section h2 {
                font-size: 35px;
            }
        }
    </style>
</head>
<body>

    <section class="trip">
        <div class="image-section">
            <div class="image-card">
                <img
                    src="C:\Users\Hp\Downloads\image1.jpe"
                    alt="Destination">
            </div>
            <div class="image-card">
                <img
                    src="C:\Users\Hp\Downloads\image2.jpe"
                    alt="Destination">
            </div>
            <div class="image-card">
                <img
                    src="C:\Users\Hp\Downloads\image3.jpe"
                    alt="Destination">
            </div>
            <div class="image-card">
                <img
                    src="C:\Users\Hp\Downloads\image4.jpg"
                    alt="Destination">
            </div>
            <div class="image-card">
                <img
                    src="C:\Users\Hp\Downloads\image5.webp"
                    alt="Destination">
            </div>
        </div>
        <div class="text-section">
            <h2>Plan A Trip  </h2>
            <p>
                Begin your journey through the beautiful
                mountains of Manali. Explore the city,
                enjoy the scenery and experience the
                local culture.
            </p>
        </div>
    </section>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Gradient Ring</title>

    <style>
        .ring {
            width: 200px;
            height: 200px;
            border-radius: 50%;

            background: conic-gradient( red,orange,yellow, green,blue, purple,red
            );

            display: flex;
            align-items: center;
            justify-content: center;
            margin: 50px auto;
        }

        .inner {
            width: 150px;
            height: 150px;
            background: white;
            border-radius: 50%;
            margin: 50px auto;
            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 24px;
           
        }
    </style>
</head>

<body>

    <div class="ring">
        <div class="inner">
            <h3>steps</h3>
        </div>
    </div>

</body>
</html>

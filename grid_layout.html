<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Login Card</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            outline: 1px solid rgb(239, 201, 201);
        }
        .container>div{
            background-color:antiquewhite;
            outline:1px solid rgb(240, 196, 196);
        }
        #box1{
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 3;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div>
    </div>
</body>
</html>
